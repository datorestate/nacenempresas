name: Diario BORME

on:
  schedule:
    # Lunes a viernes. El BOE publica el BORME hacia las 7:30 (Madrid), 6:30 en Canarias.
    - cron: "20 7 * * 1-5"    # 7:20 en Canarias y 8:20 en la Península en invierno (una hora más en verano)
    - cron: "30 10 * * 1-5"   # reintento por si la primera no encontró el BORME
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás a rellenar (la primera vez, 30)"
        default: "3"
      forzar:
        description: "Volver a procesar días ya guardados (tras añadir DATA_KEY)"
        type: boolean
        default: false
      prueba:
        description: "Generar los correos sin enviarlos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Madrid
      DATA_KEY: ${{ secrets.DATA_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_TAX_RATE: ${{ secrets.STRIPE_TAX_RATE }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      REPLY_TO: ${{ secrets.REPLY_TO }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      SUSCRIPTORES_MANUAL: ${{ secrets.SUSCRIPTORES_MANUAL }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Procesar BORME
        id: borme
        run: |
          set +e
          python -m nacenempresas.pipeline --ultimos "${{ github.event.inputs.dias || '3' }}" ${{ github.event.inputs.forzar == 'true' && '--forzar' || '' }}
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Guardar datos
        run: |
          git config user.name "nacenempresas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos BORME $(date +%F)"
          git push

      - name: Enviar avisos (una vez al día)
        run: |
          HOY=$(date +%F)
          MARCA="data/publico/enviado-$HOY"
          if [ -f "$MARCA" ]; then echo "Avisos de $HOY ya enviados"; exit 0; fi
          if [ ! -f "data/publico/$HOY.json" ]; then echo "Aún no hay BORME de $HOY"; exit 0; fi
          if [ "${{ github.event.inputs.prueba }}" = "true" ]; then
            python -m nacenempresas.avisos --fecha "$HOY" --prueba
          else
            python -m nacenempresas.avisos --fecha "$HOY"
            if [ -n "$SMTP_PASS" ]; then touch "$MARCA"; else echo "Sin SMTP_PASS: correos generados pero no enviados"; fi
          fi

      - name: Guardar marca de envío
        run: |
          git add data
          git diff --cached --quiet || git commit -m "Avisos enviados $(date +%F)"
          git push

      - name: Publicación semanal sugerida
        if: always()
        run: |
          python -m nacenempresas.sitio_web > /dev/null
          echo "## Texto para LinkedIn" >> "$GITHUB_STEP_SUMMARY"
          cat out/publicacion_semanal.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fallar si la extracción es sospechosa (te llega un email de GitHub)
        if: steps.borme.outputs.codigo != '0'
        run: exit 1

  web:
    needs: procesar
    if: always()
    uses: ./.github/workflows/_publicar.yml
    permissions:
      contents: read
      pages: write
      id-token: write
