name: Configurar Stripe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configurar:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/setup_stripe.py
      - run: |
          git config user.name "nacenempresas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/stripe.json
          git diff --cached --quiet || git commit -m "Enlaces de pago de Stripe"
          git push
  web:
    needs: configurar
    uses: ./.github/workflows/_publicar.yml
    permissions:
      contents: read
      pages: write
      id-token: write
